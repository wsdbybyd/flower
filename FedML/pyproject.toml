[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedml-satellite"
version = "1.0.0"
description = "Ground-Assisted LEO Satellite FL (FedMeta / FO-MAML)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.24.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "matplotlib>=3.7.0",  # 新增：用于绘制训练曲线
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "fedml.server:app"
clientapp = "fedml.client:app"

[tool.flwr.app.config]
# ============================================================
# 1. FL 基础训练配置
# ============================================================
num-server-rounds = 200       # 元学习通常需要更多轮次收敛
fraction-evaluate = 1.0      # 评估所有节点
batch-size = 32
learning-rate = 0.01         # 基础学习率 (保留作为默认值)

# ============================================================
# 2. FO-MAML (First-Order MAML) 训练参数
# ============================================================
# Alpha: 内部循环学习率 (Support Set 微调)
fomaml-alpha = 0.01

# Beta: 外部循环学习率 (Query Set 求导更新全局模型)
fomaml-beta = 0.01

# Inner Steps: 内部循环更新步数 (通常为 1 或 5)
fomaml-inner-steps = 5

# ============================================================
# 3. Meta-Testing (元评估) 参数
# ============================================================
# 在评估阶段，卫星对全局模型进行微调的步数 (Adaptation Steps)
meta-adapt-steps = 10

# 微调时的学习率
meta-adapt-lr = 0.01

# ============================================================
# 4. 物理层通信链路参数 (用于模拟 LEO 环境)
# ============================================================
sigma2 = 1e-9
default-distance-km = 780.0
default-tau-d-s = 50000.0   # 连接窗口时间阈值

# 上下行带宽 (Hz)
w-u-hz = 4000000.0
w-d-hz = 4000000.0

# 上下行功率 (Watts)
p-u-w = 100.0
p-d-w = 100.0

# 载波频率 (20 GHz)
f-c-hz = 20000000000.0

# 天线增益与损耗参数
A-T = 60.0
A-R = 30.0
G-H = 0.8
delta = 2.0             # 瑞利/莱斯衰落因子
psi-db-per-km = 0.5     # 大气衰减系数
zeta-km = 500.0         # 衰减尺度

# ============================================================
# 5. 距离随机化方案 (每个 Client 启动时生成)
# ============================================================
distance-km-min = 300.0
distance-km-max = 1000.0
distance-seed = 2026

# ============================================================
# 6. FedMeta 策略与成员管理参数
# ============================================================
selection-mode = "window"   # 使用基于窗口余量的节点选择策略
ks-train = 8                # 每轮用于训练的最小节点数
ks-eval = 4                 # 每轮用于评估的最小节点数
enforce-comm = true         # 强制过滤掉通信不可行(超时)的节点

# 成员动态进出管理 (Turnover)
turnover-T = 5
deltaQ = 2                  # 连续成功多少次加入网络
deltaP = 3                  # 连续失败多少次剔除网络
probe-blocked-k = 1         # 每轮尝试探测多少个被屏蔽的节点

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
# 模拟的总节点数 (SuperNodes)
options.num-supernodes = 5

[tool.flwr.federations.local-simulation-gpu]
options.num-supernodes = 5
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.2