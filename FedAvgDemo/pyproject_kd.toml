[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "test"
version = "1.0.0"
description = "Federated Learning with PyTorch and Flower (FedAvg + KD)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.24.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "fedavg.server:app"
clientapp = "fedavg.client:app"

[tool.flwr.app.config]
# ---------- FL 基本配置 ----------
num-server-rounds = 3
fraction-evaluate = 0.5
local-epochs = 1
learning-rate = 0.1
batch-size = 32

# ---------- 知识蒸馏 (KD) 配置 ----------
# alpha: 0.0 表示不使用 KD; 0.9 表示非常重视 Teacher 的输出
# temperature: 温度越高，分布越平滑，包含更多暗知识 (Dark Knowledge)
kd-alpha = 0.5
kd-temperature = 2.0

# ---------- 通信/链路默认参数（server 下发给 client）----------
sigma2 = 1e-9
default-distance-km = 780.0
default-tau-d-s = 50000.0

w-u-hz = 4000000.0
w-d-hz = 4000000.0
p-u-w = 100.0
p-d-w = 100.0
f-c-hz = 20000000000.0

A-T = 60
A-R = 30
G-H = 0.8
delta = 2
psi-db-per-km = 0.5
zeta-km = 500.0

# ---------- 方案1：每个节点启动时随机一次距离（固定）----------
distance-km-min = 300
distance-km-max = 1000
distance-seed = 2026

# ---------- 服务器侧 FedAvg 策略参数 ----------
selection-mode = "window"     
ks-train = 6
ks-eval = 3
enforce-comm = true

turnover-T = 5
deltaQ = 2
deltaP = 3
probe-blocked-k = 1

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 10

[tool.flwr.federations.local-simulation-gpu]
options.num-supernodes = 10
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.2

[tool.flwr.federations.supergrid-deployment]
address = "supergrid.flower.ai"
enable-account-auth = true