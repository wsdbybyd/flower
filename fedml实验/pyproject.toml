[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedml-satellite"
version = "1.0.0"
description = "Ground-Assisted LEO Satellite FL (FedMeta / FO-MAML + APSKD with Warm Start)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.24.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "matplotlib>=3.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["fedml"]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "fedml.server:app"
clientapp = "fedml.client:app"

[tool.flwr.app.config]
# ============================================================
# 1. FL 基础训练配置
# ============================================================
num-server-rounds = 50
fraction-evaluate = 1.0
batch-size = 32

# ============================================================
# 2. FO-MAML / 本地训练参数
# ------------------------------------------------------------
# fomaml-inner-steps: 原 15 → 改 5
#   Net 升级后参数量 ~310K，inner-loop 步数过多仍会在 support set
#   上过拟合导致 query set 梯度失真；5 步足以快速适应且不过拟合。
# ============================================================
fomaml-alpha = 0.01
fomaml-beta  = 0.01
# inner-steps = 7
#   v7 inner-loop 含 CE+KD 联合约束，7步足以让 adapted temp_model
#   与 snapshot 产生有意义的分布差距，作为 Stage2 教师软标签
fomaml-inner-steps = 7
apskd-epochs = 1
apskd-lr     = 0.01
# kd-warmup-rounds = 20
#   lambda_kd 线性 warmup 0 -> 0.4，前 20 轮逐渐增强 KD 约束
#   early rounds 全局模型弱，KD 信号低质，warmup 避免扰动初期收敛
kd-warmup-rounds = 20

# ============================================================
# 3. Meta-Testing 参数
# ============================================================
# meta-adapt-steps: 20 → 5
#   评估方式已改为客户端本地 Non-IID 数据（test_size=0.3，α=0.1）
#   每个客户端验证集约 100-200 张，batch_size=32 → 约 3-6 个 batch
#   步数过多会导致 adaptation 数据与 evaluation 数据严重重叠
#   5步：用前 5 个 batch 做 adaptation，剩余做 evaluation，干净不重叠
#   在本地偏斜数据上 5步已足够体现 MAML 的快速适应优势
meta-adapt-steps = 5
meta-adapt-lr    = 0.01

# ============================================================
# 4. 双向知识蒸馏配置
# ------------------------------------------------------------
# kd-temperature: 3.0 → 2.0
#   v6 Stage 2 APSKD 精调中 snapshot 是跨轮次全局模型
#   与 Stage 1 更新后的 net 有实质差距，不需要高温让软标签过于平滑
#   2.0 让 KD 约束适中，精调效果更明显
# ============================================================
kd-enable          = true
kd-alpha           = 0.5
kd-temperature     = 3.0
kd-batch-size      = 64
kd-cal-samples     = 2048
kd-global-samples  = 4096
kd-forward-epochs  = 1
kd-forward-lr      = 0.05
kd-reverse-epochs  = 1
kd-reverse-lr      = 0.01

# ============================================================
# 5. 物理层通信链路参数
# ============================================================
sigma2             = 1e-9
default-distance-km = 780.0
default-tau-d-s    = 50000.0

w-u-hz  = 4000000.0
w-d-hz  = 4000000.0
p-u-w   = 100.0
p-d-w   = 100.0
f-c-hz  = 20000000000.0
A-T     = 60.0
A-R     = 30.0
G-H     = 0.8
delta   = 2.0
psi-db-per-km = 0.5
zeta-km = 500.0

distance-km-min = 300.0
distance-km-max = 1000.0
distance-seed   = 2026

# ============================================================
# 9. 数据分区配置
# ============================================================
# Dirichlet alpha：控制 Non-IID 异质程度
#   alpha → 0  极端 Non-IID（每客户端近似只有1个类）
#   alpha = 0.5  中度 Non-IID（FedAvg 仍能良好收敛，Meta-Learning 优势不明显）
#   alpha = 0.1  高度 Non-IID（FedAvg 明显 client drift，Meta-Learning 优势充分体现）
#   alpha → ∞  趋近 IID
dirichlet-alpha = 0.1

# ============================================================
# 6. FedMeta 策略与成员管理参数
# ============================================================
selection-mode  = "window"
# num-supernodes = 5，每轮参与节点数：
# ks-train = 4：每轮选 4/5 个节点训练，覆盖率 80%，保留一定随机性
# ks-eval  = 3：每轮选 3/5 个节点评估，与训练比例接近
ks-train        = 4
ks-eval         = 3
enforce-comm    = true

turnover-T      = 5
deltaQ          = 2
deltaP          = 3
probe-blocked-k = 1

# ============================================================
# 7. Client local training mode（占位，实验由 server.py 自动轮换）
#    server.py 会依次运行：fedavg → fedprox → scaffold → fedkd → fedmeta → ours
# ============================================================
client-train-mode = "ours"

# ============================================================
# 8. 六大方法专属超参
# ============================================================

# ── FedAvg (McMahan et al., 2017) ───────────────────────────
# 标准 SGD + Weight Decay + Label Smoothing
# learning-rate 调低至 0.005：Non-IID 场景下减少 client drift，
# 保证 FedAvg 在公平条件下发挥最优性能，避免 lr 过大人为劣化
fedavg-local-epochs    = 1
fedavg-weight-decay    = 1e-4
fedavg-label-smoothing = 0.1
learning-rate          = 0.005

# ── FedProx (Li et al., 2020) ───────────────────────────────
# 在 FedAvg 基础上加入近端项 (mu/2)||w - w_global||²
# mu=0.01：近端项强度，越大越约束本地更新靠近全局模型
#   mu 太小 ≈ FedAvg，mu 太大 → 本地更新被过度压制，精度下降
#   0.01 是文献推荐值，在中高 Non-IID (α=0.1) 下效果稳定
fedprox-mu      = 0.01
local-epochs    = 1
weight-decay    = 1e-4
label-smoothing = 0.1

# ── SCAFFOLD (Karimireddy et al., 2020) ─────────────────────
# 控制变量 (c_i, c) 修正本地梯度，消除 client drift
# scaffold-lr：SCAFFOLD 推荐使用比 FedAvg 略大的 lr，
#   因为梯度已被控制变量修正，不需要通过小 lr 来抑制漂移
scaffold-lr     = 0.01

# ── FedKD (Wu et al., 2022) ─────────────────────────────────
# 服务器端教师模型软标签蒸馏客户端学生模型
# kd-temperature 与 Ours 共用（见第4节），此处不重复
# fedkd-lr：FedKD 使用软标签监督，梯度方差比纯 CE 小，可适当加大 lr
fedkd-lr        = 0.005

# ── FedMeta / FO-MAML (Finn et al., 2017) ───────────────────
# 元学习内外循环参数见第2节（fomaml-alpha / fomaml-beta / fomaml-inner-steps）
# FedMeta 不使用双向 KD（kd-enable 对 fedmeta 模式无效）

# ── Ours (FO-MAML + APSKD + Bidirectional KD) ───────────────
# 完整方法参数：
#   内循环    → fomaml-alpha, fomaml-inner-steps（第2节）
#   外循环    → fomaml-beta（第2节）
#   APSKD精调 → apskd-epochs, apskd-lr, kd-warmup-rounds（第2节）
#   双向KD    → kd-* 系列参数（第4节）

[tool.flwr.federations]
default = "local-simulation-gpu"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 10
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.0

[tool.flwr.federations.local-simulation-gpu]
# RTX 4060 Laptop 8GB 适配说明：
#
# num-supernodes = 5（原 10）
#   MobileNetV2 学生模型单次训练 ~7MB 显存，10 节点看似都塞得下，
#   但 MAML 的 copy.deepcopy 会在 GPU 上同时保留 net + temp_model，
#   实际峰值约 15MB × 5并发 = 75MB，加上 PyTorch 框架开销和 Flower 序列化，
#   节点数减半可大幅降低调度碎片，每轮训练时间缩短约 30%。
#
# num-gpus = 0.5（原 0.2）
#   1.0 / 0.5 = 2 个客户端并发，每个客户端独占 4GB 显存配额。
#   原 0.2 → 5 个并发，但 RTX 4060 Laptop 是笔记本单卡，
#   Ray 多进程争抢 CUDA context 带来额外开销，反而不如少并发跑满 GPU。
#
# num-cpus = 4（原 2）
#   配合 load_data num_workers=2，每个客户端进程需要 2 个 worker，
#   2 个并发客户端 × 2 workers = 4 CPU，与核心数匹配。
options.num-supernodes = 5
options.backend.client-resources.num-cpus = 4
options.backend.client-resources.num-gpus = 0.5