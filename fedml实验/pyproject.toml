[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedml-satellite"
version = "2.0.0"
description = "LEO Satellite FL: 6-Method Comparison (FedAvg/FedProx/SCAFFOLD/FedKD/FedMeta/Ours)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.24.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "matplotlib>=3.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["fedml"]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "fedml.server:app"
clientapp = "fedml.client:app"

[tool.flwr.app.config]
# ============================================================
# 1. FL 基础参数
# ============================================================
num-server-rounds = 50
fraction-evaluate = 1.0
batch-size        = 32
dirichlet-alpha   = 0.1     # Non-IID 程度（0.1 = 高度异构）

# ============================================================
# 2. 公共本地训练参数（FedAvg / FedProx / SCAFFOLD / FedKD 共用）
# ============================================================
learning-rate   = 0.005     # FedAvg / FedProx / FedKD / SCAFFOLD 基础 lr
local-epochs    = 1         # 本地轮次
weight-decay    = 1e-4
label-smoothing = 0.1

# ============================================================
# 3. FedProx 专属参数
# ============================================================
fedprox-mu = 0.01           # 近端项系数 μ

# ============================================================
# 4. SCAFFOLD 专属参数（控制变量初始化由 server 管理）
# ============================================================
# scaffold 无额外超参，lr = learning-rate 即可

# ============================================================
# 5. FedKD 参数（与 Ours 共享 kd-temperature / kd-alpha）
# ============================================================
# kd-temperature 和 kd-alpha 见第 7 节

# ============================================================
# 6. FedMeta / Ours 元学习参数
# ============================================================
fomaml-alpha       = 0.01
fomaml-beta        = 0.01
fomaml-inner-steps = 7      # Ours inner-loop 步数（含 KD 约束）
apskd-epochs       = 1
kd-warmup-rounds   = 20     # lambda_kd warmup 轮数 0→0.4

# FedMeta 单独用较少 inner-steps（无 KD 约束，纯 CE inner-loop）
# 在 server.py 中 fedmeta 模式会覆盖为 5

# ============================================================
# 7. 双向知识蒸馏参数（FedKD / Ours 均使用）
# ============================================================
kd-enable          = true
kd-alpha           = 0.5
kd-temperature     = 3.0
kd-batch-size      = 64
kd-cal-samples     = 2048
kd-global-samples  = 4096
kd-forward-epochs  = 1
kd-forward-lr      = 0.05
kd-reverse-epochs  = 1
kd-reverse-lr      = 0.01

# ============================================================
# 8. Meta-Testing 评估参数（所有方法公用，确保对比公平）
# ============================================================
meta-adapt-steps = 5        # adaptation 步数
meta-adapt-lr    = 0.01     # adaptation 学习率

# ============================================================
# 9. 物理层通信链路参数
# ============================================================
sigma2            = 1e-9
default-tau-d-s   = 50000.0
w-u-hz            = 4000000.0
w-d-hz            = 4000000.0
p-u-w             = 100.0
p-d-w             = 100.0
f-c-hz            = 20000000000.0
A-T               = 60.0
A-R               = 30.0
G-H               = 0.8
delta             = 2.0
psi-db-per-km     = 0.5
zeta-km           = 500.0
distance-km-min   = 780.0   # LEO 仰角 90° 最短斜距
distance-km-max   = 2300.0  # 仰角 10° 最大斜距
distance-seed     = 2026

# ============================================================
# 10. FedMeta 策略与成员管理参数
# ============================================================
selection-mode  = "window"
ks-train        = 8
ks-eval         = 5
enforce-comm    = true
turnover-T      = 5
deltaQ          = 2
deltaP          = 3
probe-blocked-k = 1

# ============================================================
# 11. FedAvg baseline 专属参数（兼容旧接口）
# ============================================================
fedavg-local-epochs    = 1
fedavg-weight-decay    = 1e-4
fedavg-label-smoothing = 0.1

# ============================================================
# 12. 占位：实验由 server.py 自动轮换 6 种模式
# ============================================================
client-train-mode = "ours"

[tool.flwr.federations]
default = "local-simulation-gpu"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 10
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.2

[tool.flwr.federations.local-simulation-gpu]
options.num-supernodes = 10
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.2