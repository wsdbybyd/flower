[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedml-satellite"
version = "1.1.0"
description = "Ground-Assisted LEO Satellite FL (FedMeta / FO-MAML + APSKD with Warm Start) — NWPU-RESISC45"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.24.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "matplotlib>=3.7.0",
    "datasets>=2.14.0",   # HuggingFace datasets，tanganke/resisc45 加载依赖
    "Pillow>=9.0.0",      # RESISC45 为 JPEG 图片，需要 PIL 读取
]

[tool.hatch.build.targets.wheel]
packages = ["fedml"]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "fedml.server:app"
clientapp = "fedml.client:app"

[tool.flwr.app.config]
# ============================================================
# 1. FL 基础训练配置
# ============================================================
num-server-rounds = 200
fraction-evaluate = 1.0
batch-size = 32

# ============================================================
# 2. FO-MAML / 本地训练参数
# RESISC45 (45 类) 比 CIFAR-10 (10 类) 难度更高，
# 适当降低 inner-steps 避免在 support set 过拟合
# ============================================================
fomaml-alpha = 0.01
fomaml-beta  = 0.01
fomaml-inner-steps = 5
apskd-epochs = 1
apskd-lr     = 0.001
kd-warmup-rounds = 10

# ============================================================
# 3. Meta-Testing 参数
# adaptation_steps 降至 5（原 10）：步数过多在测试集上适应会破坏参数
# adaptation_lr 降至 0.005（原 0.01）：更保守的适应步长
# ============================================================
meta-adapt-steps = 5
meta-adapt-lr    = 0.005

# ============================================================
# 4. 双向知识蒸馏配置
# RESISC45 类别多 (45 类)，软标签分布更分散，温度适当降低
# ============================================================
kd-enable          = true
kd-alpha           = 0.5
kd-temperature     = 1.5
kd-batch-size      = 64
kd-cal-samples     = 2048
kd-global-samples  = 4096
kd-forward-epochs  = 1
kd-forward-lr      = 0.05
kd-reverse-epochs  = 1
kd-reverse-lr      = 0.01

# ============================================================
# 5. 物理层通信链路参数（LEO 卫星）
# ============================================================
sigma2             = 1e-9
default-distance-km = 780.0
default-tau-d-s    = 50000.0

w-u-hz  = 4000000.0
w-d-hz  = 4000000.0
p-u-w   = 100.0
p-d-w   = 100.0
f-c-hz  = 20000000000.0
A-T     = 60.0
A-R     = 30.0
G-H     = 0.8
delta   = 2.0
psi-db-per-km = 0.5
zeta-km = 500.0

distance-km-min = 300.0
distance-km-max = 1000.0
distance-seed   = 2026

# ============================================================
# 6. FedMeta 策略与成员管理参数
# ============================================================
selection-mode  = "window"
ks-train        = 6
ks-eval         = 3
enforce-comm    = true

turnover-T      = 5
deltaQ          = 2
deltaP          = 3
probe-blocked-k = 1

# ============================================================
# 7. Client local training mode（占位，server.py 自动轮换）
# ============================================================
client-train-mode = "fomaml+apskd"

# ============================================================
# 8. FedAvg Baseline 专属参数
# RESISC45 45 类任务，label smoothing 更重要
# ============================================================
fedavg-local-epochs = 1
learning-rate       = 0.001
fedavg-weight-decay    = 1e-4
fedavg-label-smoothing = 0.1

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 5

[tool.flwr.federations.local-simulation-gpu]
options.num-supernodes = 5
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.2